name: CI

# PRs: lint + build. Push to main: publish to staging. v* tag: publish to production.
on:
    pull_request:
    push:
        branches: [main]
        tags: ["v*"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm
            - uses: CompeyDev/setup-rokit@v0.2.1
              with:
                  cache: true
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm build
            - uses: actions/upload-artifact@v7
              with:
                  name: places
                  path: places/*/*.rbxl
                  if-no-files-found: error

    publish:
        if: github.event_name == 'push'
        needs: build
        runs-on: ubuntu-latest
        environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
        concurrency: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - uses: CompeyDev/setup-rokit@v0.2.1
              with:
                  cache: true
            - uses: actions/download-artifact@v8
              with:
                  name: places
                  path: places
            - run: node scripts/publish.mjs ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
              env:
                  RBXCLOUD_API_KEY: ${{ secrets.RBXCLOUD_API_KEY }}
